name: Build & Release EPUBs

on:
  schedule:
    # Run at 00:00 UTC on the 1st and 15th of every month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Allow manual trigger via GitHub UI

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases

    steps:
      # 1. Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. Install Python libraries used in your scripts
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-frontmatter pyyaml weasyprint

      # 4. Install system dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc imagemagick weasyprint

      # 5. Run your Image Manipulator Script
      - name: Process Images
        run: python scripts/images_epub.py
        env:
          PYTHONUTF8: 1
          PYTHONIOENCODING: utf-8

      # 6. Run your EPUB Builder Script
      - name: Build EPUBs
        run: python scripts/build_epub.py
        env:
          PYTHONUTF8: 1
          PYTHONIOENCODING: utf-8

      # 7. Generate a unique tag for the release
      - name: Generate Release Tag
        id: tag
        # Removed "shell: bash" because bash is the default on Ubuntu
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      # 8. Create GitHub Release and Upload Assets
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tag.outputs.date }}
          name: EPUB v${{ steps.tag.outputs.date }}
          draft: false
          prerelease: false
          files: |
            epub/*.epub